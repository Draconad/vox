name: Vox
options:
  bundleIdPrefix: com.jtquayle
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Vox:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Vox
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        # Keeps generated speech playing when the screen locks, and keeps the
        # hands-free conversation alive while the phone is in your pocket.
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Vox records your voice to transcribe it and to capture reference clips for voice cloning.
        NSSpeechRecognitionUsageDescription: Not used - all recognition happens on your own audio.cpp server.
        NSLocalNetworkUsageDescription: Vox connects to the audio.cpp server on your local network.
        # Plain http:// to any address (LAN, Tailscale or a public IP). Don't add
        # NSAllowsLocalNetworking here: on iOS 10+ its presence makes iOS ignore
        # NSAllowsArbitraryLoads, which then blocks http to non-local addresses.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jtquayle.vox
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    scheme: {}
